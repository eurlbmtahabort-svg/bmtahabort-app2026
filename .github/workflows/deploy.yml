name: Compile Genuine Android APK

on:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract Native Android Structure
        run: |
          sudo apt-get install -y unzip
          # فك ضغط الملف الجديد الشامل في مجلد مؤقت
          unzip *.zip -d project_extracted
          
          # نقل محتويات المجلد المستخرج بالكامل إلى السطح الرئيسي للمستودع
          if [ -d project_extracted/android ]; then
            cp -r project_extracted/* . || true
          else
            # في حال وجود مجلد فرعي آخر بداخل الـ ZIP
            cp -r project_extracted/*/* . || true
          fi

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: |
          # التثبيت المباشر للمكتبات المصلحة في الملف الجديد
          npm install
          npm run build --if-present

      - name: Compile Genuine Android Project
        run: |
          # إضافة الخصائص القياسية للأندرويد وتجاوز تكرار كوتلن
          if [ -d android ]; then
            echo "android.useAndroidX=true" >> android/gradle.properties
            echo "android.enableJetifier=true" >> android/gradle.properties
            
            # الدخول لمجلد الأندرويد الأصلي لملفك وتجميعه مباشرة
            cd android && ./gradlew assembleDebug
            mkdir -p ../android_output
            cp app/build/outputs/apk/debug/app-debug.apk ../android_output/BMTahabort-Lab-App.apk
          else
            echo "Error: Android folder not found in the root!"
            exit 1
          fi

      - name: Package Production APK File
        uses: actions/upload-artifact@v4
        with:
          name: BMTahabort-Lab-App-APK
          path: android_output/BMTahabort-Lab-App.apk
